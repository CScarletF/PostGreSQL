---
# Post-deploy patch: widens HAProxy's listener binds from the pinned
# per-node bind_address (e.g. 192.168.20.180) to 0.0.0.0 (all interfaces).
#
# WHY THIS EXISTS:
# bind_address is pinned in inventory to resolve Flannel CNI virtual
# interface auto-detection picking the wrong address for Postgres/Patroni
# TLS SANs and pg_hba.conf rules (see Phase 1 notes). Autobase's HAProxy
# role reuses that same variable for every `bind` line in haproxy.cfg —
# but HAProxy has no TLS-SAN or pg_hba identity concern the way Postgres
# does. A load balancer needs to accept connections from wherever clients
# reach it, including via the Keepalived VIP (192.168.20.190), which is
# not bound to any single node's real interface. Pinning HAProxy to a
# single real IP silently breaks VIP-routed traffic: packets addressed to
# the VIP never match a socket bound only to the node's own address, so
# they're dropped even while the VIP itself moves correctly between nodes.
#
# SCOPE: widens all five listeners (stats, master, replicas,
# replicas_sync, replicas_async) — Phase 3's goal is a single client
# endpoint for read/write traffic, not just a working stats page.
#
# CRITICAL — NOT SET-AND-FORGET:
# Originally believed this only reverted on an Autobase playbook re-run.
# Root-caused 2026-08-21: confd re-renders haproxy.cfg from
# /etc/confd/templates/haproxy.tmpl on ANY etcd-observed topology change
# (leader renewal, replica reconnect), not on a fixed schedule and not
# only on Autobase re-runs. This role now patches BOTH the rendered
# haproxy.cfg AND the confd template it's regenerated from, so the fix
# should hold across confd's normal re-renders going forward. Still
# worth re-running this role after any full Autobase redeploy, since a
# clean deploy would re-ship the original (unpatched) template.

- name: Verify haproxy.cfg exists before attempting to patch it
  stat:
    path: /etc/haproxy/haproxy.cfg
  register: haproxy_cfg_stat

- name: Fail early if haproxy.cfg is missing (Phase 2 not deployed yet)
  fail:
    msg: >
      /etc/haproxy/haproxy.cfg not found on this host. This role assumes
      Phase 2 (Autobase HAProxy role) has already deployed and rendered
      the config. Run the Autobase playbook first.
  when: not haproxy_cfg_stat.stat.exists

- name: Widen all HAProxy listener binds from bind_address to 0.0.0.0
  replace:
    path: /etc/haproxy/haproxy.cfg
    regexp: 'bind {{ bind_address }}:'
    replace: 'bind 0.0.0.0:'
    # Validates the edited file with HAProxy's own config checker before
    # it's allowed to overwrite the real file — catches a bad regex
    # match or unexpected format instead of shipping a broken config.
    validate: '/usr/sbin/haproxy -c -f %s'
  notify: reload haproxy

- name: Verify confd's haproxy template exists before attempting to patch it
  stat:
    path: /etc/confd/templates/haproxy.tmpl
  register: confd_haproxy_tmpl_stat

# WHY THIS SECOND PATCH IS NEEDED (found the hard way, 2026-08-21):
# haproxy.cfg above isn't actually the root of the problem -- it's
# confd that owns it. confd watches etcd for cluster topology changes
# and re-renders haproxy.cfg from THIS template on every change (leader
# renewal, replica reconnect, etc.) -- not on a fixed schedule, and not
# only on an Autobase re-run as originally assumed. The template itself
# ships with the node's own IP already hardcoded into every `bind` line
# (not a confd {{ }} variable), so every re-render reverts the widened
# bind regardless of how many times haproxy.cfg itself is patched
# directly. This is the actual fix; the haproxy.cfg patch above is now
# effectively redundant once this holds, but left in place since it's
# harmless and covers the moment right after a fresh Autobase deploy,
# before confd's first re-render.
- name: Widen all binds in confd's haproxy template from node IP to 0.0.0.0
  replace:
    path: /etc/confd/templates/haproxy.tmpl
    regexp: 'bind (\d{1,3}\.){3}\d{1,3}:'
    replace: 'bind 0.0.0.0:'
    validate: '/usr/sbin/haproxy -c -f %s'
  when: confd_haproxy_tmpl_stat.stat.exists
  notify: restart confd