---
# Non-secret configuration for provisioning webapp_demo. Secrets
# (superuser password, generated app password) are NOT here -- see
# webapp_postgres_secrets.yml.example at the repo root.

# Connect through the Keepalived VIP's HAProxy "master" listener, same
# as the app's own .env DB_HOST/DB_PORT -- this always routes to
# whichever node is currently Patroni primary, so this role never needs
# to know or care which physical node that is.
webapp_postgres_vip: "192.168.20.190"
webapp_postgres_vip_port: 5000

webapp_postgres_superuser_user: postgres

webapp_postgres_db_name: webapp_demo
webapp_postgres_app_user: webapp_app

# Every module folder under here with a schema.sql gets its schema
# applied (if the table doesn't already exist) and webapp_app granted
# scoped privileges on it -- adding a new module to the app needs no
# change to this role, same principle as app.py's own directory scan
# and setup.py's sync_all_modules.
# Path as it exists ON THE TARGET HOST (jenkins) -- this whole role now
# runs there, not on the controller. Adjust if app-framework ever moves.
webapp_postgres_modules_dir: "/home/jenkins/app-framework/modules"

# Still resolved on the controller -- Ansible's password lookup plugin
# always runs locally regardless of hosts:, and caching it on the
# control node (not jenkins) is unchanged from the original design.
webapp_postgres_app_password_file: "{{ playbook_dir }}/.secrets/webapp_app_password.txt"