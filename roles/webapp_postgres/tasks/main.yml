---
- name: Generate (or reuse) webapp_app password
  ansible.builtin.set_fact:
    webapp_postgres_app_password: >-
      {{ lookup('password', webapp_postgres_app_password_file + ' length=32 chars=ascii_letters,digits') }}
  no_log: true

- name: Create database and scoped application role
  ansible.builtin.import_tasks: create_db_and_role.yml

- name: Discover every module with a schema.sql
  ansible.builtin.find:
    paths: "{{ webapp_postgres_modules_dir }}"
    patterns: "schema.sql"
    recurse: true
  register: webapp_postgres_schema_files

# _template is excluded the same way app.py/scaffold.py exclude it: by
# folder name, not by a maintained list.
- name: Read each schema.sql (to derive table dependencies)
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: webapp_postgres_schema_contents
  loop: "{{ webapp_postgres_schema_files.files | map(attribute='path') | reject('search', '/_template/') | list }}"
  loop_control:
    label: "{{ item | dirname | basename }}"

# Produces webapp_postgres_ordered_paths. find returns files in directory-walk
# order, which is arbitrary; applying in that order fails on a fresh database
# whenever a table is created before the table it references.
- name: Order schemas by REFERENCES dependencies
  ansible.builtin.include_tasks: order_modules.yml

# include_tasks (not import_tasks) -- needed so `loop` actually
# re-evaluates this file's tasks once per module, rather than being parsed
# once at playbook-parse time the way import_tasks is.
- name: Apply schema and grant privileges for each module, in dependency order
  ansible.builtin.include_tasks: apply_and_grant_module.yml
  loop: "{{ webapp_postgres_ordered_paths }}"
  loop_control:
    loop_var: webapp_postgres_schema_path

# Role membership, not table-scoped -- granted once per role run, not
# once per module.
- name: Grant pg_monitor membership (for dashboard replication-status queries)
  community.postgresql.postgresql_membership:
    db: "{{ webapp_postgres_db_name }}"
    login_host: "{{ webapp_postgres_vip }}"
    login_port: "{{ webapp_postgres_vip_port }}"
    login_user: "{{ webapp_postgres_superuser_user }}"
    login_password: "{{ webapp_postgres_superuser_password }}"
    group: pg_monitor
    target_roles: "{{ webapp_postgres_app_user }}"
    state: present
